<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البطلة ظلامة</title>
    <style>
        body { background: #0b0d17; color: white; font-family: sans-serif; text-align: center; padding: 40px; }
        .big-card { max-width: 600px; margin: auto; background: #1a1d2e; border: 2px solid #d4af37; border-radius: 20px; padding: 30px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
        .big-card img { width: 100%; border-radius: 15px; margin-bottom: 20px; border: 1px solid #d4af37; }
        h1 { color: #d4af37; font-size: 2.5rem; margin-bottom: 20px; }
        p { font-size: 1.3rem; line-height: 1.8; color: #eee; }
        .back-btn { display: inline-block; margin-top: 30px; padding: 12px 25px; background: #d4af37; color: #0b0d17; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="big-card">
        <img src="zalamah-card.png" alt="ظلامة">
        <h1>البطلة ظلامة </h1>
        <p>ظلامة هي حارسة قصر المرايا هي شخصية غامضة وهي عدوة فرح .</p>
        <a href="cards.html" class="back-btn">العودة للأبطال</a>
    </div>
</body>
</html>
