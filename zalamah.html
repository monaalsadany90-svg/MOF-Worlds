<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ظلامة - حاكم المرايا</title>
    <style>
        body { background: #0b0d17; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px; margin: 0; }
        .big-card { max-width: 600px; margin: auto; background: #1a1d2e; border: 2px solid #d4af37; border-radius: 20px; padding: 30px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
        .big-card img { width: 100%; border-radius: 15px; margin-bottom: 20px; border: 1px solid #444; }
        h1 { color: #d4af37; font-size: 2.5rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        p { font-size: 1.3rem; line-height: 1.8; color: #eee; text-align: justify; padding: 0 10px; }
        .back-btn { display: inline-block; margin-top: 30px; padding: 12px 25px; background: #d4af37; color: #0b0d17; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: white; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="big-card">
        <img src="zalamah.png" alt="ظلامة">
        
        <h1>ظلامة</h1>
        
        <p>
            ظلامة هو الحاكم الغامض لـ <b>"قصر المرايا الخادعة"</b>. شخصية مهيبة تتسم بالهدوء والحكمة، يراقب كل من يدخل عالمه عبر انعكاسات المرايا المتعددة. 
            يظهر ظلامة بمظهر بسيط ووقور، بدون تاج أو أجنحة، متمسكاً بسحره الخاص الذي يختبر به شجاعة الأبطال وصدق نواياهم.
        </p>
        
        <a href="cards.html" class="back-btn">العودة لعالم الكروت</a>
    </div>

</body>
</html>
