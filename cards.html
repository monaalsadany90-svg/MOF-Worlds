<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقات أبطال عالم فرح وعمر</title>
    <style>
        body { 
            background: #0b0d17; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        /* شريط التنقل العلوي */
        nav { 
            background: #1a1d2e; 
            padding: 15px; 
            margin-bottom: 30px; 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            border-bottom: 2px solid #d4af37; 
        }
        nav a { color: #d4af37; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        nav a:hover { color: white; }

        h1 { color: #d4af37; margin-bottom: 30px; font-size: 2rem; }

        /* شبكة البطاقات */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 20px; 
            max-width: 1200px; 
            margin: auto;
        }

        /* تصميم الكارت نفسه */
        .card { 
            background: rgba(26, 29, 46, 0.8); 
            border-radius: 15px; 
            padding: 10px; 
            transition: 0.4s; 
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover { 
            transform: translateY(-10px); 
            border-color: #d4af37; 
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            cursor: pointer; 
        }

        /* تنسيق صورة البطاقة الطويلة */
        .card img { 
            width: 100%; 
            height: auto; 
            max-height: 500px; /* طول البطاقة ليكون متناسق */
            border-radius: 10px; 
            object-fit: contain; /* عشان البطاقة تظهر كاملة بكل تفاصيلها */
        }

        h2 { color: #d4af37; font-size: 1.5rem; margin: 15px 0 5px 0; }
        p { font-size: 1rem; color: #ccc; margin-bottom: 15px; }

        a { text-decoration: none; color: inherit; }
    </style>
</head>

</nav>
