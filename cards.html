        nav a { color: #d4af37; text-decoration: none; font-weight: bold; }

        .card { background: #1a1d2e; border: 1px solid #333; border-radius: 15px; padding: 15px; transition: 0.3s; height: 100%; }
        .card:hover { transform: scale(1.05); border-color: #d4af37; cursor: pointer; }
        .card img { width: 100%; border-radius: 10px; height: 250px; object-fit: cover; margin-bottom: 10px; }
        h2 { color: #d4af37; font-size: 1.2rem; margin: 5px 0; }
        p { font-size: 0.9rem; color: #ccc; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
